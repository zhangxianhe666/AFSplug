name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

jobs:
  release:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      actions: write

    strategy:
      # 五个平台共用同一个 tag，必须串行：electron-builder 发布前会先按 tag 查
      # release，并发时几个 job 同时查空、各建一个 draft，最终产生重复 Release
      # 且各自只带一半资产（v1.8.0 现场：两个 draft 各 13 个资产，缺另一半）。
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            arch: arm64
          - os: macos-latest
            arch: x64
          - os: windows-latest
            arch: x64
          - os: ubuntu-latest
            arch: x64
          - os: ubuntu-latest
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Build application
        run: npm run build

      - name: Build and Publish (macOS)
        if: matrix.os == 'macos-latest'
        run: npx electron-builder --mac --${{ matrix.arch }} --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Build and Publish (Windows)
        if: matrix.os == 'windows-latest'
        run: npx electron-builder --win --${{ matrix.arch }} --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/

      - name: Build and Publish (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npx electron-builder --linux --${{ matrix.arch }} --publish=always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_MIRROR: https://github.com/electron/electron/releases/download/
